# Generates app/Kestrl.xcodeproj (gitignored). Run scripts/build-app.sh to build everything in order.
name: Kestrl
options:
  bundleIdPrefix: dev.kestrl
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: NO
targets:
  Kestrl:
    type: application
    platform: macOS
    sources:
      - path: Kestrl
      - path: Generated
    dependencies:
      - framework: Frameworks/KestrlFFI.xcframework
        embed: false
    info:
      path: Kestrl/Info.plist
      properties:
        CFBundleName: Kestrl
        CFBundleDisplayName: Kestrl
        CFBundleIconFile: AppIcon.icns
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: "15.0"
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kestrl.app
        PRODUCT_NAME: Kestrl
        GENERATE_INFOPLIST_FILE: NO
        OTHER_LDFLAGS:
          - -lresolv
          - -lpcap
          - -framework
          - Security
          - -framework
          - CoreFoundation
          - -framework
          - SystemConfiguration
