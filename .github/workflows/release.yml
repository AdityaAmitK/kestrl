name: Release

# Tags publish a release. Pushes to main build the same artifacts without publishing, which
# checks the release build and warms the Rust caches that tag runs restore from main.
on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      is_release: ${{ steps.release.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Validate version and changelog
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          IS_RELEASE: ${{ inputs.tag != '' || startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          [[ "$IS_RELEASE" == "true" ]] || exit 0
          [[ "${RELEASE_TAG#v}" == "$version" ]] || { echo "Tag $RELEASE_TAG does not match Cargo.toml version $version" >&2; exit 1; }
          awk -v heading="## [$version]" 'index($0, heading) == 1 { found=1; next } found && /^## / { exit } found { print }' CHANGELOG.md > release-notes.md
          [[ -s release-notes.md ]] || { echo "CHANGELOG.md has no ## [$version] section" >&2; exit 1; }
          cat >> release-notes.md <<'EOF'

          ## Install

          Install the CLI on macOS or Linux with `curl -fsSL https://kestrl.adityakinjawadekar.com/install.sh | sh`, or on macOS with `brew install adityaamitk/tap/kestrl`. The Linux CLI is a static binary; iOS Simulator and port capture are macOS only. Install the macOS app with `brew install --cask adityaamitk/tap/kestrl`, or download the DMG below.

          ## First launch of the unsigned app

          The app is ad-hoc signed and not notarized. macOS may block its first launch; in Privacy & Security, choose **Open Anyway**. The macOS CLI binary is also ad-hoc signed.
          EOF
      - if: steps.release.outputs.is_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  cli:
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-cli
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build universal CLI
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          targets=(aarch64-apple-darwin x86_64-apple-darwin)
          for target in "${targets[@]}"; do
            cargo build --locked --release -p kestrl-cli --target "$target"
          done
          mkdir -p dist/cli
          lipo -create "target/${targets[0]}/release/kestrl" "target/${targets[1]}/release/kestrl" -output dist/cli/kestrl
          codesign --force --sign - dist/cli/kestrl
          cp LICENSE README.md scripts/kestrl-bpf.sh dist/cli/
          tar -C dist/cli -czf "dist/kestrl-$VERSION-macos-universal.tar.gz" kestrl LICENSE README.md kestrl-bpf.sh
          cd dist
          shasum -a 256 "kestrl-$VERSION-macos-universal.tar.gz" > "kestrl-$VERSION-macos-universal.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: dist/kestrl-*-macos-universal.tar.gz*
          retention-days: 7

  cli-linux:
    needs: validate
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-cli-linux-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build static CLI
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET: ${{ matrix.arch }}-unknown-linux-musl
          ASSET: kestrl-${{ needs.validate.outputs.version }}-linux-${{ matrix.arch }}.tar.gz
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
          cargo build --locked --release -p kestrl-cli --target "$TARGET"
          mkdir -p dist/cli
          cp "target/$TARGET/release/kestrl" LICENSE README.md dist/cli/
          tar -C dist/cli -czf "dist/$ASSET" kestrl LICENSE README.md
          cd dist
          sha256sum "$ASSET" > "$ASSET.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-linux-${{ matrix.arch }}
          path: dist/kestrl-*-linux-*.tar.gz*
          retention-days: 7

  app:
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-app
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install xcodegen
      - name: Build and package app
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          app_path="$(scripts/build-app.sh --release | tail -n 1)"
          codesign --force --deep --sign - "$app_path"
          mkdir -p dist/dmg
          ditto "$app_path" "dist/dmg/Kestrl.app"
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname Kestrl -srcfolder dist/dmg -ov -format UDZO "dist/Kestrl-$VERSION.dmg"
          cd dist
          shasum -a 256 "Kestrl-$VERSION.dmg" > "Kestrl-$VERSION.dmg.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: dist/Kestrl-*.dmg*
          retention-days: 7

  publish:
    needs: [validate, cli, cli-linux, app]
    if: needs.validate.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          assets=(
            "dist/kestrl-$VERSION-macos-universal.tar.gz"
            "dist/kestrl-$VERSION-macos-universal.tar.gz.sha256"
            "dist/kestrl-$VERSION-linux-x86_64.tar.gz"
            "dist/kestrl-$VERSION-linux-x86_64.tar.gz.sha256"
            "dist/kestrl-$VERSION-linux-aarch64.tar.gz"
            "dist/kestrl-$VERSION-linux-aarch64.tar.gz.sha256"
            "dist/Kestrl-$VERSION.dmg"
            "dist/Kestrl-$VERSION.dmg.sha256"
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Kestrl $tag" --notes-file dist/release-notes.md
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --title "Kestrl $tag" --notes-file dist/release-notes.md
          fi
