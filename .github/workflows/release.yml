name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Validate version and changelog
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          workspace_version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          [[ "$version" == "$workspace_version" ]] || { echo "Tag $RELEASE_TAG does not match Cargo.toml version $workspace_version" >&2; exit 1; }
          awk -v heading="## [$version]" 'index($0, heading) == 1 { found=1; next } found && /^## / { exit } found { print }' CHANGELOG.md > release-notes.md
          [[ -s release-notes.md ]] || { echo "CHANGELOG.md has no ## [$version] section" >&2; exit 1; }
          cat >> release-notes.md <<'EOF'

          ## Install

          Install the CLI with `curl -fsSL https://kestrl.adityakinjawadekar.com/install.sh | sh` or `brew install adityaamitk/tap/kestrl`. Install the app with `brew install --cask adityaamitk/tap/kestrl`, or download the DMG below.

          ## First launch of the unsigned app

          The app is ad-hoc signed and not notarized. macOS may block its first launch; in Privacy & Security, choose **Open Anyway**. The CLI binary is also ad-hoc signed. Updating the app may prompt again for Keychain access.
          EOF
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build universal CLI
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          targets=(aarch64-apple-darwin x86_64-apple-darwin)
          for target in "${targets[@]}"; do
            cargo build --locked --release -p kestrl-cli --target "$target"
          done
          mkdir -p dist/cli
          lipo -create "target/${targets[0]}/release/kestrl" "target/${targets[1]}/release/kestrl" -output dist/cli/kestrl
          codesign --force --sign - dist/cli/kestrl
          cp LICENSE-MIT LICENSE-APACHE README.md scripts/kestrl-bpf.sh dist/cli/
          tar -C dist/cli -czf "dist/kestrl-$VERSION-macos-universal.tar.gz" kestrl LICENSE-MIT LICENSE-APACHE README.md kestrl-bpf.sh
          cd dist
          shasum -a 256 "kestrl-$VERSION-macos-universal.tar.gz" > "kestrl-$VERSION-macos-universal.tar.gz.sha256"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build and package app
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          app_path="$(scripts/build-app.sh --release | tail -n 1)"
          codesign --force --deep --sign - "$app_path"
          mkdir -p dist/dmg
          ditto "$app_path" "dist/dmg/Kestrl.app"
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname Kestrl -srcfolder dist/dmg -ov -format UDZO "dist/Kestrl-$VERSION.dmg"
          cd dist
          shasum -a 256 "Kestrl-$VERSION.dmg" > "Kestrl-$VERSION.dmg.sha256"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          tag="v$VERSION"
          assets=(
            "dist/kestrl-$VERSION-macos-universal.tar.gz"
            "dist/kestrl-$VERSION-macos-universal.tar.gz.sha256"
            "dist/Kestrl-$VERSION.dmg"
            "dist/Kestrl-$VERSION.dmg.sha256"
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Kestrl $tag" --notes-file release-notes.md
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --title "Kestrl $tag" --notes-file release-notes.md
          fi
