# nginx site for https://kestrl.adityakinjawadekar.com (static files from site/, deployed by
# scripts/deploy-site.sh). Installed as /etc/nginx/sites-available/kestrl on the VPS.
#
# All headers are set at server level: an add_header inside a location would silently drop
# every server-level add_header (security headers included) for that location.

# Pages, styles, scripts and install.sh revalidate on every load (cheap with ETags), so a
# deploy is never half-cached. Images rarely change and may be cached for a week.
map $uri $kestrl_cache_control {
    default                               "no-cache";
    ~*\.(svg|png|webp|ico)$               "public, max-age=604800";
}

server {
    listen 80;
    listen [::]:80;
    server_name kestrl.adityakinjawadekar.com;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kestrl.adityakinjawadekar.com;
    ssl_certificate /etc/letsencrypt/live/kestrl.adityakinjawadekar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kestrl.adityakinjawadekar.com/privkey.pem;

    add_header Cache-Control $kestrl_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'" always;

    root /var/www/kestrl;
    index index.html;
    charset utf-8;
    location / { try_files $uri $uri/ $uri.html =404; }
    location = /install.sh { default_type text/plain; }
    location = /skill/SKILL.md { default_type text/plain; }
}
