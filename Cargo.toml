[workspace]
resolver = "2"
members = ["crates/kestrl-core", "crates/kestrl-cli", "crates/kestrl-ffi"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/AdityaAmitK/kestrl"

[workspace.dependencies]
kestrl-core = { path = "crates/kestrl-core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip", "brotli", "json"] }
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }
keyring = { version = "3", features = ["apple-native"] }
ulid = "1"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "local-offset"] }
directories = "5"
urlencoding = "2"
uniffi = "0.32"
rpassword = "7"
ctrlc = { version = "3.5", features = ["termination"] }
regex = "1"
postgres = { version = "0.19", features = ["with-time-0_3", "with-uuid-1", "with-serde_json-1"] }
postgres-types = { version = "0.2", features = ["with-serde_json-1"] }
postgres-native-tls = "0.5"
native-tls = "0.2"
uuid = "1"
hudsucker = { version = "0.25", default-features = false, features = ["rcgen-ca", "rustls-client"] }
rcgen = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
http-body-util = "0.1"
bytes = "1"
flate2 = "1"
brotli = "9"
tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
base64 = "0.22"
pcap = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "warn"
